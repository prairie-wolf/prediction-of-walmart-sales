[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walmart-sales-study"
version = "0.1.0"
description = "Weekly store sales analysis and one-week-ahead forecasting"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.4,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
